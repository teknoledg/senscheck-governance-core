# Render Blueprint: static site for SensCheck Governance — Core (legal pages + JSON Schemas).
# No server logic, no secrets, no database. The SDK itself never calls this site.
services:
  - type: web
    name: senscheck
    runtime: static
    buildCommand: node scripts/build-site.mjs
    staticPublishPath: ./site
    # Add after DNS is ready (CNAME senscheck -> <service>.onrender.com). Uses a subdomain so the
    # teknoledg.com apex is left alone.
    domains:
      - senscheck.teknoledg.com
    headers:
      - path: /schema/*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Cache-Control
        value: public, max-age=300
